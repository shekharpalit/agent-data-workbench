[build-system]
requires = ["hatchling>=1.32.0,<2"]
build-backend = "hatchling.build"

[project]
name = "agent-data-workbench"
version = "0.5.0"
description = "A local workbench for researching agent traces and running reviewed improvement experiments."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
dependencies = [
    "pydantic>=2.13.5,<3",
    "typer>=0.27.2,<1",
    "fastapi>=0.141.1,<1",
    "uvicorn>=0.52.4,<1",
    "sqlalchemy>=2.0.52,<3",
    "mcp>=2.2.0,<3",
]

[project.scripts]
agent-data-workbench = "agent_data_workbench.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10",
    "ruff>=0.16.6,<1",
    "httpx2>=2.12.0,<3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/agent_data_workbench"]

[tool.hatch.build.targets.wheel.force-include]
"ui/dist" = "agent_data_workbench/_ui"

[tool.hatch.build.targets.sdist]
include = ["/src", "/ui", "/tests", "/openwiki", "/AGENTS.md", "/CLAUDE.md", "/.agents", "/.claude", "/.codex", "/.mcp.json", "/.openwikiignore", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore", "/Makefile", "/Dockerfile", "/compose.yaml", "/.dockerignore"]
exclude = ["/ui/node_modules", "/ui/coverage", "**/__pycache__", "**/*.tsbuildinfo", "/openwiki/.run.json"]

[tool.hatch.build.targets.sdist.force-include]
"ui/dist" = "ui/dist"

[tool.uv]
prerelease = "disallow"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I"]
